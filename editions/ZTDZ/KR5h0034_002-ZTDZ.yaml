body:
  text: 吕純陽吕巖字洞賓唐蒲州永樂縣人號純陽子初母就蓐時異香滿室天樂浮空一白鶴自天而下飛入帳中不見生而金形木質鶴頂龜背鳳眼朝天雙眉入鬢少聰明日記萬言矢口成文身長八尺二寸狀類張子房二十不娶始在襁褓馬祖見曰此兒骨相不凡自是風塵物外他時遇廬則居見鍾則扣留心記取後遊廬山遇火龍眞人傳天遁劍法唐會昌中兩舉進士不第時年六十四歲遊長安酒肆見一羽士青巾白袍偶書絶句於壁曰坐卧常携酒一壺不教雙眼識星都乾坤許太無名姓踈散人間一丈夫洞賓訝其狀貌奇古詩意飄逸因揖問姓氏羽士曰吾雲房先生也居在終南鶴嶺子能從遊乎洞賓未應雲房因與同憩肆中雲房自爲執炊洞賓忽就枕昏睡夢以舉子赴京狀元及第始自郎署擢臺諫翰苑秘閣及諸清要無不備歷兩娶富貴家女生子婚嫁蚤畢幾四十年又獨相十年權勢薰炙偶被重罪籍没家資分散妻孥流于嶺表一身孑然立馬風雪中方興浩嘆恍然夢覺炊尚未熟雲房笑吟曰黄梁猶未熟一夢到華胥洞賓驚曰先生知我夢耶雲房曰子適來之夢升沉萬態榮悴千端五十年間一瞬耳得不足喜喪不足悲世有大覺而後知人世一大夢也洞賓感悟遂拜雲房求度世術雲房試之曰子骨節尚未完欲求度世須更數世可也翩然别去洞賓即棄儒歸隱雲房自是十試洞賓第一試洞寳自外遠歸忽見家人皆病死洞賓心無悔恨但厚備葬具而己須臾死者皆起無恙第二試洞賓鬻貨於巿議定其值市者翻然止酬其眞之半洞賓無所爭委貨而去第三試洞寳元日出門遇丐者倚門求施洞賓即與錢物而丐者索取不厭且加詳詈洞賓惟再三笑謝第四試洞賓牧羊山中遇一餓虎奔逐羣羊洞賓獨以身當之虎廼釋去第五試洞賓居山中草舍讀書一女容華絶世光艶照人自言歸寧迷路借此少憩既而調弄百端洞賓竟不爲動第六試洞賓一日郊出及歸則家貲爲盗刼盡洞賓了無愠色躬耕自給忽鋤下見金數十片速掩之一無所取第七試洞賓遇賣銅器者巿之以歸皆金也即訪賣主還之第八試有風狂道士陌上市藥自言服者立死再世得道洞賓買之道士曰子速備後事可也輙服無恙第九試春潦泛溢洞寳與衆共涉至中流風濤掀湧衆皆危懼洞賓端坐不動第十試洞賓獨坐一室忽見奇形怪狀鬼魁無數有欲擊者有欲殺者洞賓絶無所懼忽聞空中一叱聲鬼神皆不復見一人撫掌大笑而下即雲房也曰吾十試子皆無所動得道必矣吾今授子黄白之術濟世利物使三千功滿八百行圓方來度子洞賓曰所作庚辛有變異乎曰三千年後還本質耳洞賓愀然曰誤三千年後人不願爲也雲房笑曰子推心如此三千八百悉在是矣乃携洞賓至鶴嶺悉傳以上眞秘訣又以靈寳畢法及靈丹數粒示洞賓授受間有二仙捧金簡寳符語雲房曰上帝詔汝爲九天金闕選仙雲房謂洞賓曰吾赴帝召汝好住人間修功立德他時亦當如我洞賓再拜曰巖之志異於先生必須度盡天下衆生方願上昇也於是雲房乘雲冉冉而去洞賓既得雲房之道兼火龍眞人天遁劍法始遊江淮試靈劔遂除蛟害隱顯變化四百餘年常遊湘覃岳鄂及兩浙汴譙間人莫知識自稱回道人宋政和中宫中有祟白晝見形盗金寳妃嬪上精齋虔禱奏詞凡六十日晝寢見東華門外有一道士碧蓮冠紫鶴𣰉手持水晶如意揖上曰臣奉上帝命來治此祟即召一金甲丈夫捉祟劈而啗之且盡上問丈夫何人道士曰此仍陛下所封祟寧眞君關羽也上勉勞再四因問張飛何在羽曰張飛爲臣累劫世世作男子身今已爲陛下生於相州岳家矣上問道士姓名道士曰臣姓陽四月十四日生夢覺録之知其爲洞賓也自是宫禁帖然遂詔天下有洞賓香火處皆正妙通眞人之號其神通妙用不能盡述後岳穆武父果夢張飛託世故以飛命名云孫登孫登字公和於汲郡北山上窟中住夏則編草爲裳冬則披髮自覆善長嘯好讀易鼓一絃琴性無喜怒嵇康從之遊三年問其所圖終不答將别謂曰先生竟無言乎登曰子識火乎火生而有光而不用其光果然在於用光人生而有才而不用其才果然在於用才故用光在乎得薪所以保其耀用才在乎識眞所以全其年康又請學琴登不教之曰子才多識寡難免于今之世矣後康果遭吕安事在獄爲詩自責云昔慚下惠今愧孫登登竟白日昇天左慈左慈字元放廬江人於天柱山中精思學道得石室中丹經尤明六甲能使鬼神坐致行厨變化萬象曹操召見閉一室斷穀期年出之顔色如故操嘗宴賓曰今日高會所少松江鱸耳慈因求銅盆貯水以竿鈎之即得鱸操曰恨無蜀薑慈曰易得操恐近取即曰前使買錦可報增二十段慈曰諾乃擲盃空中化鶴而去須臾袖中出薑後買錦者回果云是日得報增錦操出郊從者百許慈爲齎酒一升脯一斤手自斟酌百官莫不醉鮑操怪之行視諸壚悉亡其酒脯矣操惡其怪因收慈欲殺之慈乃郤入壁中霍然不知所在或見於市捕之而巿人皆變形與慈同莫辨誰是或逢慈於陽城山頭因復逐之遂奔入羊群操知不可得乃令使告之曰不復相殺本試君術耳忽有一老羝屈前兩膝人立而言曰遽如許使欲取之而群羊數百皆變爲羝竝人立云遽如許亦莫知取焉韓湘子韓湘子字清夫韓文公猶子也落魄不覊遇純陽先生因從游登桃𣗳墮死而尸觧來見文公文公勉之學湘曰湘之學與公異因作詩見志曰青山雲水窟此地是吾家子夜餐瓊使寅晨咀絳霞琴彈碧王調爐煉白珠砂寳鼎存金虎芝田養白鴉一瓢藏造化三尺斬妖邪觧造逡巡酒能開頃刻花有人能學我同其看仙葩公覽曰子豈能奪造化耶公即爲開樽果成佳醖復聚土無何開碧花一朵花間擁出金字一聯云雲横秦嶺家何在雪擁藍關馬不前公讀之不解其意湘曰他日自驗未幾公以極諫佛骨事謫官潮州途中遇雪俄有一人冒雪而來乃湘也曰公能憶花間句乎公詢其地即藍關嗟嘆久之曰吾爲汝足此詩即韓集中一封朝奉九重天云云遂與湘宿藍關傳舍公方信湘之不誣也湘辭去出藥一瓢與公曰服一粒可以禦瘴公愴然湘曰公不久即西不惟無恙且當復用公曰此後復有相見之期乎湘曰前期未可知也曹國舅曹國舅宋太后弟也因其弟每不法殺人深以爲耻遂隱跡山巖精思玄理野服葛巾經旬不食一日遇鍾離純陽二仙問曰聞子修飬所飬何物對曰養道曰道何在舅指天曰天何在舅指心二仙笑謂曰心即天天即道子親見本來面目矣遂授以還眞秘術引入仙班許眞君許遜字敬之號眞君南昌人吴赤鳥二年母夢金鳳銜珠墜於掌上翫而吞之因是有娠而生眞君少小踈通與物無忤嘗從獵射一塵鹿中之而斃鹿母皇顧䑛之因感悟折棄亐矢尅意爲學博通經史尤嗜神仙修煉之術聞西安吴猛得丁義神方乃徃師之悉受其秘日以修煉爲事時買一鐵燈檠因夜然燈見漆剥處有光視之金也明日訪售主還之晉武帝太康元年舉孝廉辟爲旌陽縣令吏民悅服歲饑民無以輸眞君乃以靈丹點瓦礫成金令人潜瘞於縣圃一日藉民之未輸者使服力於圃民鋤地得金用以輸納遂悉安堵又歲大疫死者十七八眞君以所得神方極治之他郡病民相繼而至於是標竹於郭外置符水於其中使就竹下飲之皆瘥久之知晉室將亂乃棄官東歸嘗憇於栢林有女童五人各持寳劔來獻眞君異而受之既而偕至眞君之家惟日擊劔自娱眞君知其劔仙也卒獲神劔之用既而大吴君遊於丹陽黄堂聞諶姆多道術遂同徃叩以道妙姆曰昔孝悌王下降曲阜蘭公家謂蘭公曰後晉代當有神仙許遜傳吾此道留下金丹寳經銅符鐵劵扣吾掌之以俟子積有年矣今當授子乃擇日登壇出孝悌王諸秘悉傳之眞君方心期每歲必來謁姆姆即覺之曰子勿來吾即還帝鄉矣因取香茅一根南望擲之曰子歸茅落處立吾祠歲秋一至足矣二君還覓訪飛茅之迹遂建祠宇每歲仲秋之三日必朝謁焉初眞君徃訪飛茅偶憇眞靖見鄉民盛烹宰以祀神且相戒曰祭不腆則神怒降禍眞君曰怪崇敢爾乃召風雷伐之拔其林木明日告其里人曰妖社已驅毋用祭也又見人苦遠汲乃以杖刺社前涸澤出泉以濟之雖旱不竭渡小蜀江感江干主人朱氏迎接甚勤乃戲畫一松於其壁其家因之得利加倍後江漲潰堤巿舍俱漂惟松壁不壞眞君徃西安縣行過一小廟廟神迎告曰此有蛟害民知仙君來逃徃鄂渚矣眞君至鄂堵路逢三老人指曰蛟伏前橋下眞君至橋仗劍叱之妖蛟驚奔入大江匿于深淵乃勅吏兵出遂誅之時海昏之上繚有巨蛇據山爲穴吐氣成雲亘四十里人畜在其氣中者俱被吞吸人爲民害眞君聞之乃其弟子遂前至蛇所仗劔布炁蛇懼入穴乃飛符召海昏社伯驅之蛇始入穴舉首高十餘丈目若火炬吐毒衝天眞君嘯命風雷呼指神兵以攝伏之使不得動乃飛步踏其首以劍劈其顙弟子施岑甘戟等引兵揮之蛇腹裂有小蛇自腹中出長數丈甘君欲斬之眞君曰彼未爲害不可妄誅一千二百五十餘年後爲民害吾當復出誅之以吾壇前植栢爲驗其枝指壇掃地是其時也只預識云吾仙去後一千二百四十年間豫章之境五陵之内當出地仙八百人此時小蛇若爲害彼八百人自當誅之蛇子遂得入江眞君曰大蛇雖滅蛟精未誅恐其俟隙潰郡城吾歸郡乎乃與甘施二君歸郡周覽城邑遇一少年通謁自稱姓愼禮貌勤恪應對敏給遽告眞君謂弟子曰適來者非人即老校故來見試也迹其所之乃在郡城江滸化黃牛卧沙磧之上眞君剪紙化黑牛徃鬬之令施岑潜持劍徃俟其鬥酣即揮之施君一揮中其左股牛奔入城南眞至長沙化爲人入賈玉似君之家先是蛟精嘗暮玉之美女化爲一美少年謁之玉愛其才乃妻以女居數載生二子常以春夏之交孑然而出至秋則乘巨艦重載而歸蓋乘春夏大水覆舟所獲也是秋空還紿玉云財貨爲盗所刼且傷左股玉求醫療之眞君即爲醫士謁玉玉喜召壻出蛟精覺懼不敢出眞君隨至其堂厲聲叱曰江湖蛟精害物不淺吾尋蹤至此豈容復蔵速出蛟精計窮遂見本形蛇蜒堂下爲吏兵所誅眞君以法水噀其二子亦皆爲小蛟併誅之眞君謂玉曰蛟精所居其下深不踰尺皆洪波九可速徙居玉乃還高原其地果䧟爲淵眞君復還豫章而蛟之餘黨甚盛慮眞君誅之皆化爲人詭言曰僕家長安積世崇善遠聞賢師許君有神劍願聞其功弟子語之曰吾師神劍指天天裂指地地折萬邪不敢當神聖之寳也蛟黨曰亦有不能傷者于弟子戲之曰惟不能傷冬瓜葫蘆爾蛟黨以壹誠然盡化爲葫蘆冬瓜浮泛滿江眞君知不蛟黨所化以劍授施岑履水斬之悉無唯武由是水妖屏迹城邑無虞明帝太寧二年大將軍王敦舉兵内向次慈湖眞君與吴君同徃謁敦異說止之時郭璞在幕府固璞與俱見敦喜延之飲而問曰子夢一木破天君等以爲何如眞君曰非佳兆也吴君曰木上破天未字也公宜未可妄動敦色變令璞筮之璞曰無成敦怒令武士擒璞斬之眞君乃舉杯擲地化爲白鵠飛繞梁棟敦一舉目己失二君所在後敦敗二君還至金陵欲買舟至豫章而舟人告以乏刺舟者眞君曰爾但瞑目安坐切勿胡視吾自爲汝駕之默召二龍挾舟而行舟漸凌空俄過廬山頂至紫霄峯金闕洞舟人拜求濟度眞君教以服餌靈草遂得辟穀不死隱於此山二君各乘一龍以歸舊隱數十年間不復以時事關意惟精修至道孝武寧康二年眞君二百三十六歲八月朔旦有二仙自天而下云奉玉皇命授眞人以九州都仙太史高明大使之職並告以冲舉之日遂乘雲車而去是月望日遥聞天樂之音祥雲冉冉羽蓋龍車從宫兵衛仙童玉女前後導從乃揖眞君昇龍車眞君與其父族侍從盱烈與其母部侍從仙眷四十二口同時白日拔宅昇天雞犬亦隨百里之内異香芬馥經月不散葛仙公葛玄字孝先丹陽句容人號曰葛仙公從左慈受丹液仙經嘗與客食言及變化之事客曰願先生作一事爲戲玄曰君得無促促欲有所見乎乃嗽口中飯盡成大蛒數百集客身有間玄張口蜂皆飛入嚼之是舊飯也能指石人使行指蝦蟆及諸昆蟲燕雀之屬歌舞絃節皆如人狀或宴客冬設生瓜棗夏致氷雪無人傳杯杯自至前如酒不盡杯不去也晋武帝召問曰百姓思雨可致乎玄曰易耳乃書符著社中俄項大雨偶行遇一神廟凡過一礼百步下車否則有警仙公乃命車直投輙大風驟起塵埃蔽天仙公怒曰小邪敢爾乃書一符令徒者投廟中廟屋自焚過武康見一人家病作請巫祀妖邪邪附巫者與仙公飲仙公故不飲而妖邪出語不遜仙公厲聲叱曰奸鬼敢爾敕五伯拽妖邪頭附柱鞭背出血流地妖邪伏罪乃止過華陰見一士人溺于蛇精仙公化作一田夫驅黄犢而耕因說士人曰汝婦蛇精也前後啖人不計其數士人不之信乃引士人看古井井中白骨盈積士人恐遂教士人容窺其跡士人乃窺之果蛇也仙公禁而斬之即以一符與士人服即瀉下蚯蚓蝦蟆之類無數遂得全生嘗在荆門軍紫益山修煉值天寒大凍仙公跣足衣衫𧟋縷時有屈家二女偶見憐之夤夜促成雙履次日獻之仙公已去但存爐灰尚温二女撥灰得丹一粒姊妹分而服之自後神氣冲冲不饑不渴時人咸謂得仙矣嘗從吴王各船行至三江口過風船多漂没仙公船亦不知所在吴主嘆曰葛仙公有道何不能免此踰宿忽見仙公水上步來既至尚有酒態謝曰昨伍子胥强邀留飮是以淹屈陛下嘗于西峯石壁上石臼之中搗藥遺墜一粟許有飛禽遇而食之遂得不死至今月白風清之夜其禽猶作丁當杵臼之聲名曰搗藥鳥仙人琴高聞仙公得道自東海跨雙鯉來訪仙公與之酣飲既醉高四白雲間酒醒雙鯉化爲石矣仙公贈以雙鶴跨之而還石至今存嘗有客從仙公泛舟見囊中有十數符客曰此符驗可見不仙公即取一符投水中逐水而下客曰常人投之亦然仙公復取一符投之逆水而上客曰異矣仙公復取一符投之即不上不下須臾上符下符會于中流良久收之又于水濱見鬻大魚者謂魚主曰欲假此魚到河伯魚者曰已死矣曰亦可以丹書紙納魚口中投於水躍然而去如此神異不能盡述後仙去何仙姑何仙姑廣州增城縣何泰女也生而頂有六毫年十四五夢神人教曰食雲母粉當輕身不死因餌之遂誓不嫁常徃來山谷其行如飛每朝去暮則持山果歸遺其母後漸辟穀武后遺使召赴闕中路復失去景龍中白日昇仙天寳九載見于麻姑壇立五色雲中大曆中又現身于廣州小石樓張果張果隱於恒州中條山徃來汾𣈆間得長生秘術常乘一白驢日行數萬里休息時折疊之其厚如紙置于巾箱中乘則以水噀之復成驢唐太宗高宗徴之下起武后召之出山佯死於妬女廟前時方炎暑須臾臭爛生蟲於是則天信其死矣後有人於恒州山中復見之開元二十三年明皇詔通事舍人裴晤馳驛於恒州迎之果至東京於集賢院安置備加禮敬帝問神仙不答善息氣累日不食數飲酒上賜之酒辭曰小臣飲不過二升有一弟子可飲一斗明皇喜令召之俄頃一小道士自殿簷飛下年可十五六美姿容步趣閑雅明皇命坐果曰弟子當侍直明皇愈喜賜酒飲及一小斗果辭曰不可更賜過度明皇因逼賜之醉酒從頂上湧出冠衝落地忽化爲金榼上及嬪御皆驚笑視之失道士矣但金榼在地驗之乃集賢院中榼也榼僅貯一斗酒帝謂高力士曰吾聞飲堇而無苦者奇士也時天寒因取以飲果三進頽然曰非佳酒也乃寢頃視齒焦縮顧在右取如意擊墮之蔵帶中出藥傳之良久齒復出粲然如玉上狩咸陽獲一大鹿將令大官烹之果曰此仙鹿也已滿千歲昔漢武帝元狩五年臣曾侍從畋于上林獲此鹿乃放之上曰鹿多矣時遷代變豈常存乎果曰武帝放之時以銅牌誌於左角下遂命驗之果有銅牌二寸許但文字凋落耳上問葉法善曰果何人也答曰臣知之然臣言之即死故不敢言若陛下能免冠跣足救臣臣方敢言上許之法善曰混沌初分白蝙蝠精言未絶七竅流血僵仆於地上遽詣果所免冠跣足自稱其罪果徐曰此兒多口過不罰之恐泄天地之機耳上復哀懇久之果以水噀其面法善即時復生帝益重之詔圖形集賢院號通玄先生果屢陳老病乞歸恒州天寳初明皇遺使徴果果聞輒卒弟子葬之後發棺但空棺而已帝立棲霞觀祀之黃野人黄野人葛洪弟子洪棲山煉丹野人常隨之洪既仙去留丹于羅浮山柱石之間野人得一粒服之爲地行仙後有人遊羅浮宿石巖間中夜見一人無衣而紺毛覆體意必仙也乃再拜問道其人了不顧但長笑數聲聲振林木復歌曰雲來萬嶺動雲去天一色長笑兩三聲空山秋月白其人歸道其形容即野人也司馬眞人司馬承慎字子微事潘師正傳辟穀導引之術遍遊名山唐睿宗迎至京帝問其術對曰爲道日損損之又損以至於無爲帝曰治身則爾治國若何對曰身猶國也游心爲淡合氣於漠與物自然而無容私焉則天下治帝嘆詠曰廣成子之言何以加此辭歸天台廬蔵用指終南山曰此中大有佳處何必天台對日以僕觀之是仕宦之捷徑爾廬初隱終南後登庸聞言硃有慚色開元中文靖天師與承禎赴千秋節齋直長生殿中夜行道畢隔雲屏各就枕微聞若小兒誦經聲聲玲玲如金玉天師乃褰裳躡步聽之見承禎額上有一小日如錢光耀一席逼而視之乃水禎腦中之聲也天師還謂其徒曰黄庭經云泥丸九眞皆有房方圓一寸處此中先生之謂乎一日謂弟子日吾令爲東華君所召必須徃俄頃化去如蟬脫弟子葬其衣冠焉時年八十有九有修眞秘㫖之志論等書行於世王質王質晋衢州人入山伐木至石室山見石室中有數老人圍棊質置斧觀之老人以物如棗核與質令含咽其汁便不覺饑渴且告云汝來己久可還質取斧柯已盡爛矣質亟歸家已數百年親舊無復存者復入山得道人徃徃見之陶弘景陶弘景字道明秣陵人初母夢青龍自懷而出已而有娠生而幼有異操十歲見葛洪神仙傳晝夜研尋謂人日仰青雲睹白日不覺爲遠矣及長身長七尺七寸神儀明秀朗目踈眉耳各有七十餘毛出外二寸許右膝有數十黑子作七星文讀書萬卷善琴棋工草隸弱冠齊高帝作相引爲諸王侍讀雖在朱門閉影不交外物惟以披閱爲務永明十年脫朝服掛神武門上表辭禄詔許之乃止于句容之茅山立館號曰華陽隱居徧歷名山尋訪仙藥每經澗谷必坐其間吟詠盤桓不能己沈約爲東陽守高其志節累書邀之竟不至弘景爲人員通謙謹出處冥會心如明鏡遇物便了永元初架三層樓弘景處其上與物遂絶惟一家僮得至其所元善騎射晩皆不爲雅聽吹笙而己特愛松風庭院皆植松每聞其響欣然爲樂有時獨游泉石望見者咸以爲仙人及梁武禪代弘景援引圖讖數處皆成梁字令弟子進之武帝恩禮愈篤及得神符秘訣以爲神丹可成而苦無藥物帝給黄金朱砂等物乃合飛丹色如霜雪服之體輕帝服亦驗益敬重之屢加禮聘並不就惟晝兩牛一牛散放水草之間一牛著金籠頭有人執袍以策驅之武帝笑曰此人欲學曳尾之龜豈可復致國家每有大事無不咨之時謂山中宰相年逾八十無異壯容後簡文帝臨南徐州欽其風素退居後堂召之弘景葛巾進見與談數日而去帝甚爲敬異其弟子桓闓得道將昇天弘景問曰某行教修道勤亦至矣得非有過尚淹延在世我乃托闓探之闓昇天後還謂弘景曰師之陰功極著但所修本草多用虫水蛭之類功雖及人亦傷命物以此一紀後方解形拂世爲蓬萊都水監耳弘景復以草木之藥可代物命者著别行本草三卷以贖其過一日無疾自知應逝逆尅亡日仍作告逝詩大同二年卒時年八十五顏色不變屈伸如常香氣累日氤氲滿山裴航裴航唐長慶中書生因下第遊千鄂渚謁故舊崔相國相國贈錢二十萬遂挈歸于京因傭巨舟載於襄漢聞同載有樊夫人國色也航無由睹面因侍婢裊烟而達詩一章曰向爲胡越猶懷想况遇天仙隔錦屏儻若玉京朝會去願隨鸞鶴入青冥數日後夫人亦使裊烟答詩一章云一飯瓊漿百感生玄霜搗盡見雲英藍橋便是神仙窟何必崎嶇上玉京航覽之空愧佩而已然亦不能洞達詩之㫖意及抵襄漢夫人使婢挈粧奩不辭而去航遍求訪竟無蹤兆後經藍橋驛因渴甚下道求飮見茅屋三四間有老嫗緝麻其下航揖嫗求漿嫗咄曰雲英携一甌漿來郎君飲航憶夫人詩有雲英之句正訝之俄葦簿之下雙手如玉捧出瓷甌航接飲之不啻玉液也因還甌遽揭簿見一女子光彩照人航愛慕不已因白嫗曰某僕馬甚乏願少憇於此嫗曰任郎君自便耳良久告嫗曰向睹小娘子艶麗驚人姿容耀世所以躊蹰而不能去願納厚禮而娶之可乎嫗曰老病只有此孫女昨有神仙與靈藥一刀圭但須玉杵臼檮之百日方可就吞若欲娶此女者須得玉杵臼其餘金帛吾無用處耳航拜謝曰願以百日爲期必携杵臼至幸無復許人嫗曰如約航至京遍訪玉杵臼忽遇一貨玉翁曰近有一玉杵臼非二百緍不可得航乃傾囊兼賣僕馬方及其值輙步驟獨携而抵藍橋嫗見大笑曰世間有如此信士乎遂許以爲婚女亦微笑曰雖然更爲擣藥百日方議婚好嫗於襟帶間解藥付航航即擣之每夜獨聞搗藥聲航窺之見玉兔持杵而舂百日足嫗持藥而吞之曰吾當入洞而告姻戚爲裴郎具幃帳遂挈女入山謂航曰但少留此逡巡車馬隸人迎航見一大第連雲朱扉晃日仙童侍女引航入帳就禮訖航拜嫗不任感荷及引見諸姻戚皆神仙中人一女仙鬟髻霓衣云是妻之姊航拜訖女仙曰裴郎不意鄂渚同舟而抵襄漢乎航愧謝左右曰是小娘子之姊雲翹夫人劉綱仙君之妻也已列高眞爲玉皇之女史嫗遂將航夫妻入玉峯洞中瓊樓珠室而居之餌以絳雪瓊英之丹體漸清虛毛髮紺緑神化自在超爲上仙至太和中友人盧顥遇之於藍橋驛之西備說得道之事乃贈藍田美玉十斤紫府雲丹一粒顥稽顙請曰兄既得道乞一言惠教航曰老子云虛其心實其腹顥猶懵然復語之曰心多妄想腹漏精液虛實可知也言訖忽不見孫思邈孫思邈華原人七歳日誦千言獨孤信見之曰聖童也顧器大難爲用耳及長好談老莊隱於太白山學道鍊氣飬神求度世之術洞曉天文精究醫藥務行陰德偶見牧童傷小蛇血出思邈脫衣贖而救之旬餘出遊見一白衣少年下馬拜謝曰吾弟蒙道者所救復邀思邈至家易以己馬偕行如飛至一城廓花木盛開金碧炳耀儼若王者居見一人袷帽絳衣侍從甚衆忻喜趨接謝曰深蒙厚恩故置兒子相迎因指一青衣小兒云前者此兒獨出爲牧堅所傷賴道者脫衣贖救得有今日乃令青衣小兒拜謝思邈始省昔日救蛇事潜問左右此爲何所對曰此涇陽水府也絳衣王者命設酒饌妓樂宴思邈思邈辭以辟穀服氣惟飮酒耳留連三日乃以輕銷金珠相贈思邈堅辭不受乃命其子取龍宫奇方三十首與思邈曰此可以助道者濟世救人思邈歸以是方歷試皆效乃編八千金方中隋文帝徴爲國子博士不就至唐太宗召始詣京師永徽三年已百餘歲一日沐浴衣冠端坐謂子孫曰吾今將遊無何有之鄉矣俄而氣絶月餘顔色不變及入棺唯空衣焉後皇幸蜀夢思邈乞武都雄黄即命中使齎十斤送於峨眉頂上見一人幅巾被褐鬚眉皓白指大盤石日可置藥於此召上有表録謝使視石上大書百餘字遂録之隨寫隨滅須臾白氣漫起因忽不見成都有一僧誦法華經甚專忽一日有僕人至云先生請師誦經經過烟嵐中入一山居先生野服杖藜兩耳垂肩焚香出聽誦經遂供僧以藤盤竹著秫飯一盂杞菊數甌僧食之美若甘露復贈錢一緍僕送出路口僧因問曰先生何姓曰姓孫曰何名僕於掌中手書思邈二字僧大駭視僕遽失不見視錢皆金錢也僧自此身輕無疾後莫知所之譚峭譚峭字景升幼而聦敏文史涉目無遺獨好黄老仙傳一旦告父母出遊終南山師嵩山道士十餘年得辟穀養氣之術常醉遊夏則服烏裘冬則衣布衫或卧風雪中人謂已斃視之氣休休然頗似風狂每行吟曰線作長江扇作天靸鞋抛在海東邊蓬萊信道無多路只在譚生拄杖前後居南嶽煉丹丹成服之後遂仙去許宣平許宣平新安歙縣人唐睿宗景雲中隱於城陽山南塢結庵以居不修服餌顏若四十許人時負薪賣於巿擔上常掛一花瓢携曲竹杖每醉吟騰騰以歸吟曰負薪朝出賣沾酒日西歸借問家何處穿雲入翠微徃來三十餘年或施人危急或救人疾苦士人多訪之不得見但見庵壁題詩曰隱居三十載築室南山巔靜夜翫明月閑朝飲碧泉樵人歌隴上谷鳥戲巖前樂矣不知老都忘甲子年天寳中李白知宣平爲仙於是遊新安訪之亦不得見乃題詩於庵壁曰我吟傳舍詩來訪仙人居烟嶺迷高迹雲林隔太虛窺庭但蕭索倚杖空躊躇應化遼天鶴歸當千歲餘宣平歸見壁詩乃自題曰一池荷葉衣無盡兩𤱔黄精食有餘又被人來尋討着移庵不免更深居其庵輙爲野火所燒莫知踪跡後百餘歲至懿宗咸通十二年許明恕婢入山採樵一日獨於南山中見一人坐石上食桃問婢曰汝許明恕家婢耶婢曰是曰我即明恕之祖宣平也汝歸爲我何明恕道我在此山中與汝一桃即食之不得將出山山神惜此桃且虎狼甚多也婢食之甚美湏臾而盡乃置婢隨樵人歸婢覺樵擔甚輊到家具言入山逢祖翁宣平明恕怒婢呼祖諱取杖擊之其婢隨杖身起不知所逝後有人入山見婢復童顏遍身衣樹皮行疾如飛入深林不見玄眞子張志和字不同唐金華人母夢楓生腹上而生肅宗擢明經賜名志和命待韶翰林後親喪不復仕遨遊江湖自號煙霞釣徒又號玄眞子垂釣不設餌志不在魚也飲酒三斗不醉守眞養氣雪不寒入水不濡每酒酣鋪席水上獨坐而酌席來去如舟俄有雲鶴旋後其止遂跨鶴而昇軒轅集軒轅集不知何許人相傳數百歲顔色不老坐暗室目光長數丈每採藥於岩谷則毒龍猛獸隨之至爲衛護居常人家請齋者雖百處皆分身而若與人飮酒則袖出一壺纔容二升賓客滿座傾之彌日不竭自飮百升不醉遇病者以布巾拂之應手而愈宣宗召入問長生可致不答曰絶聲色薄滋味哀樂一致德施無偏自然與天地合德日月齊明况長生久視乎及退上以金盆覆白鵲令中使試之集曰皇帝安能更令老夫射覆乎盆下白鵲宜早放之上笑曰先生早知矣命坐御榻前令宫人侍茶湯集貌古而布素宫人有笑之者元鬢髮朱唇年方二八湏臾變爲老嫗鬢髮皤然因涕泣不已上令謝之即復故步京師素無荳蔻荔枝花上因語及頃刻二花並至枝葉如新時坐有相子集曰臣山中亦有味更佳上曰無縁得矣集乃取御前碧玉甌以寳盤覆之俄頃徹盤相子幾滿上食之嘆曰美無比又問曰朕得幾年天子集取筆書四十年但十字一起上笑曰朕安敢望四十年乎久之辭還山命中使送之每見其於一布囊内探錢施人比至江陵己施數十萬取之不竭未及至山忽亡所在不日南海奏先生己歸羅浮矣及宴駕只四十年也陳希夷陳摶字圖南號扶揺子亳州眞源人初生不能言至四五歲戲渦水水濱有青衣媪引置懷中乳之即能言敏悟過人及長經史一覽無遺先生曰向所學但足記姓名而已吾將遊泰山與安期黃石輩論出世法安能與世脂韋汨没出入生死輪逈間哉乃盡散家業惟携一石鐺而去梁唐士大夫挹其清風得識其面而睹景星慶雲然先生皆莫與交唐明宗親爲手詔召之先生至長揖不拜明宗待之愈謹以宫女三人賜先生先生賦詩謝曰雪爲肌體玉爲腮多謝君王送得來處士不興巫峽夢空煩雲雨下陽臺遂遯去隱武當山九石巖服氣辟穀凡二十餘年復移居華山時年已七十餘矣常閉門卧累月不起周世宗顯德中有樵於山麓見遺骸生塵迫而視之乃先生也良久起曰睡酣奚爲擾我後世宗召見賜號白雲先生一日乘驢遊華陰聞宋太祖登極拍掌大笑曰天下自此定矣太祖召不至再召辭曰九重仙詔休教丹鳳㗸來一片野心己被白雲留住太宗初年始赴召惟求一靜室乃賜居於建隆觀扃扃熟𥧌月餘方起辭去賜號希夷先生一日遺門人鑿石室於張超谷既成先生徃造之曰吾其歸於此乎遂以左手支頤而終七日容色不變肢體尚温有五色雲封谷口彌月不散年一百一十八歲初兵紛時太祖之母挑太祖太宗於藍以避亂先生遇之即吟曰莫道當今無天子却將天子上檐挑又遇太祖太宗與趙普遊長安巿入酒肆普坐太祖太宗之右先生曰汝紫微垣一小星爾輙處上次可乎種放初從先生先生曰汝當逢明主名馳海内但惜天地間無完名子名將起必有物敗之可戒也放晩年竟喪清節皆如其言有郭沆者少居華陰嘗宿觀下中夜先生呼令速歸且與之俱徃一二里許有人號呼報其母卒先生因遺以藥使急去可救既至灌其藥遂甦華陰令王睦謂先生曰先生居溪巖寖止何室先生且笑且吟曰華山高處是吾宫出即凌空跨曉風臺榭不將金鎖閉來時自有白雲封一日有一客過訪先生適值其睡見傍有一異人聽其息聲以黑筆記之滿紙糊塗莫辨客怪而問之其人曰此先生華胥調混沌譜也先生嘗遇毛女毛女贈之詩詩云藥苗不滿笥又更上危顛回指歸去路相將入翠烟太宗聞先生善相人遣詣南衙見眞宗及門亟還問其故曰厮役皆將相也何必見王於是建儲之議遂定先生以易數授穆伯長穆授李挺之李授邵康節以象學授種放授廬江許堅堅授範諤至今糟粕猶存也雷隱翁雷隱翁名本少磊落不群既長業進士再試即棄去默坐終日或誚其癡翁咲曰終不以吾癡易汝黠一日以術授其子遂出遊不返宋元祐間有朝士遊羅浮山見翁坐於𣗳下自吟一絶云徃徃來來三十年更無踪跡落人間功成行滿昇天去回首山頭月正圓馬自然馬湘字自然獨好經史工文學嘗與道侣徧游方外至湖州醉墮霅溪經日而出衣不沾濕言爲項羽相召飲指溪水令逆流指栁樹令隨水走來去指橋令斷復續一切小術無所不爲人或有疾告者自然無藥但以竹拄杖打患處或以杖指之口吹杖頭作雷鳴便愈有以所帛謝者固讓不取强與之輙散與貧人登杭州泰望山作詩曰太一初分何處尋空留歷數變人心九天日月移朝暮萬里山川自古今風動水光吞遠徼兩添嵐氣没高林秦皇謾作驅山計滄海茫茫轉更深後歸省兄兄適出謂嫂曰特歸與兄分此宅我惟愛東園耳待兄三日不歸遽卒明日兄歸感慟曰弟學道多年是歸託化以絶望耳乃棺歙遂窆之東園明年東川奏梓潼縣道士馬自然曰白日上昇詔杭州發其棺只一竹杖而已張紫陽張栢端天台人少好學晩傳混元之道而未備孜孜訪問徧歷四方宋熙寧二年遊蜀遇劉海蟾授金液還丹火候之訣乃改名用成字平叔號紫陽嘗有一僧修戒定慧能入定出神數百里間頃刻即到與紫陽雅志契合一日紫陽曰禪師今日能與遠遊乎僧曰可願同徃揚州觀瓊花紫陽於是與僧處一靜室相對瞑目跌坐出神紫陽至時僧以先至遶花三匝紫陽曰可折一花爲記少頃欠伸而覺紫陽曰禪師瓊花何在禪師神手皆空紫陽乃拈出瓊花與僧把翫弟子因問紫陽曰同一神遊何以有有無之異紫陽曰我金丹大道性命兼修是故聚則成形散則成氣所至之地眞神見形謂之陽神彼之所修欲速見功不復修命直修性宗故所至之地無復形影謂之陰神陰神不能動物也英宗治平中訪扶風馬默處厚於河東乃以所著悟眞篇授處厚曰平生所學盡在是矣願公流布此書當有因書而會意者元豐五年夏跌坐而化住世九十九歳弟子因火燒化得舍利千百大者如芡蕢色皆紺碧識者謂曰此道書所謂舍利耀金姿也後七年劉奉眞遇紫陽於王屋山留詩一張而去李鼻涕李鼻涕宋紹聖初劉延仲寓秀州嘗有道人過門或從求藥則以鼻涕和垢膩爲丸與之病立効因自號李鼻涕延仲延之坐曰今日適無酒爲禮道人笑曰床頭珍珠泉一尊何不出以待客劉大慚呼童取尊道人曰不必取但將空尊來尊至索紙覆之少焉香溢於外成美酒矣坐者皆醉明日劉有他客出所謂珍珠泉者而尊中無涓滴矣一日詣劉别云後二十年某月某日當於眞州相見至期劉卒於眞州歸元子爾朱洞字微通少遇異人傳還元抱一之道因自號歸元子初隱蓬山後賣藥蜀漢間行動如飛逆旅主人每夕怪其屋有聲因窺之見其身自榻而升觸棟而止或於枯骸中得物如雀卵持以問洞洞曰繇服神丹而不能修煉故純陰剥消無陽俱獨就丹田成此耳唐末王建圍成都洞亦在城中城久不下建約城䧟日誅夷無噍類洞乃施席作法籠攝建與三軍皆得神人乘黑雲叱建曰敢有禍吾民者禍即反汝建等怖伏後入成都戒兵勿殺民不改肆洞賣丹藥每一粒要錢十二萬時有某太守欲買之曰太守金多非一百二十萬不可太守以爲移言惑衆命納之竹籠沉於江中至涪陵上流二漁人乘舟而漁舉網出之乃洞也漁曰此必異人入定乎扣銅缶寤之少頃洞開目問漁人曰此去銅梁幾何有三都乎漁人曰我白石江人此去銅梁四百里自是而東即豐都縣平都山仙都觀也洞曰吾師謂吾遇三都白石浮水乃仙去殆此地耶洞既登岸語二漁人曰視子類有道者亦有所傳乎二漁曰我昔從海上仙人得三一之㫖煉陽修陰亦有年矣洞於是索酒與劇飮取丹分餌之至荔枝園中三人昇雲而去二漁人附白玉蟾葛長庚宋瓊人母以白玉蟾名之應夢也年二十二應童子科后隱居干武夷山號東瓊子事陳翠虛九年始得其道蓬頭跣足一衲弊甚喜飲酒未見其醉博洽儒書出言成章嘗自讃云千古蓬頭跣足一生服氣餐霞笑指武夷山下白雲深處吾家雷印常佩肘間祈禳則有異應時言休咎驚省聾俗嘗在京都遊西湖至暮墮水舟人驚尋不見達旦則玉蟾在水上猶醺然也一日有持刀追脅者玉蟾叱其人刀自墮而走玉蟾招之曰汝來勿驚以刀還之時稱玉幨入水不濡逢兵不害宋嘉定中詔徴赴闕對玉稱㫖命館太一宫一日不知所徃後每徃來名山神異莫測陳泥丸陳楠字南木號翠虛博羅人以盤櫳篐桶爲生後得太一刀圭金丹法於毘陵禪師得景霄大雷琅書於黎姥山神人能以符分捻土愈病時人呼之爲陳泥丸時披髮日行四五百里鶉衣百結塵垢滿身善食大肉終日爛醉嘗之蒼梧遇郡禱旱翠虛執鐵鞭下潭驅龍湏臾雷雨交作過三山大義渡洪流舟不敢行翠虛浮笠而濟行欽管道中遇群盗拉殺之瘞三日盗散復甦遊長沙衝帥節執拘送邕州獄數夕又回長沙矣中夜坐或倉水銀越宿成白金以丹法授白玉蟾寧宗嘉定間於漳入水而觧去莫月鼎莫月鼎諱洞一字起炎湖州人生而秀朗肌膚如玉雪雙曰有光射人入青城山丈人觀見徐無極受五雷之法於是月鼎自名雷師驅使鬼魅動與天合時嬉笑怒罵皆若有神物從之者无世祖召見時天色爽霽帝曰可聞雷否月鼎曰可即取胡桃擲地雷應聲而發元主爲之改容復命請雨立至元主大悅賜以金繒月鼎碎截之以濟寒窶者性愛酒無日不醉醉輙白眼望天陰飈翛翛起衣袖間嘗與客飲西湖舟中當赤日如火客請借片雲覆之月鼎笑拾果殻浮觴而項之雲自湖濱起翳于日下蕃釐觀道士中秋方會飮有雲蔽月久不解月鼎時遇觀中道士知其所爲急請赴筵月鼎以手指之雲散如洗賣餅師積餅於筐時被精怪竊去月鼎召雷轟雲中斬猢猻首于巿一人要婦半路爲白娶精所攝至門但空車焉月鼎禹步如有指麾狀狂風忽作飄婦還舍婦云適在北高峯何以忽然至此七十三歲一日屬其徒王繼華曰明年正月十三日將化於汝家及期風雷雷雨電交作索筆作偈書畢泊然而逝顔面如丹馬鈺陽馬鈺寧海人孫仙姑其妻也號丹陽子母初孕時夢麻姑賜丹一粒吞之覺而分瑞時金太宗天會五年也兒時常誦乘雲駕鶴之詩李無夢見而奇之曰額有三山手垂過膝眞大仙之材孫君以女妻之生三子嘗題詩云抱元守一是工夫懶漢如今一也無終日㗸杯暢神思醉中却有那人扶衆皆不曉其意一日王重陽祖師自終南來訪之云宿有仙契既食瓜從蒂食起鈺問其故曰甘向苦中來又問從何方來曰不遠千里特來扶醉人鈺默念與前所作詩合異之遂師事焉重陽欲挽西遊鈺未能輒棄家業重陽多方點化鈺念始决遂以貲產付三子從居崑崙之煙霞洞孫仙姑在家結庵修煉二十餘年一日鈺謂門人曰今日當有非之喜輙歌舞自娱俄聞空中樂聲仰見仙姑乘雲而過仙童玉女旌節儀仗擁導前後俯而告鈺曰先歸蓬島待君也於是夜坐談將二鼓風雷大雨震動遂東首枕肱而逝是夜鈺扣酒監郭復中門索筆書頌云喪年六十一在世無人識烈雷吼一聲浩浩隨風逸以須人云師已逝矣方悟所見者皆其陽神也張三丰張三丰遼東懿州人名居寳字玄玄生有異香龜形鶴骨大耳圓目身長七尺鬚髯如戟頂作一髻手持刀尺一笠一衲寒暑御之不飾邊幅人目爲張獵𤠐日行千里靜則暝目旬日所啖斗升輙盡或辟穀數月自若也元末居寳鷄金臺觀留頌辭世而逝上人楊斬山置棺殮訖臨窆發視之復生乃入蜀洪武初至太和山修煉結庵於玉虛宫庵前古木五株嘗栖其下久則猛獸不距鷙鳥不搏人益異之後入武當當語鄉人云兹山異日當大顯於時居二十三年拂神遊方而去消摇墟經第二卷下槐字二尾
