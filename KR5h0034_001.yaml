body:
  text: 列仙姓氏老子東王公西王母赤松子廣成子青烏公彭祖鐵拐先生王子喬尹喜李八百丁令威鬼谷子劉越太上老父白石生安期生東方朔鍾離權馬成子劉海蟾黃安劉晨浮丘伯魏伯陽張道陵梅福蕭史費長房黃初平藍采和麻衣子麻姑吕純陽孫登左慈韓湘子曹國舅許真君葛仙翁何仙姑張果老王質黃野人陶弘景司馬真人裴航孫思邈談峭許宣平玄真子軒轅集陳希夷雷隱翁馬自然張紫陽李鼻涕歸元子白玉蟾陳泥丸莫月鼎馬丹陽張三丰老君老子者太上老君也纍世化身而未有誕生之迹逮商陽甲時分神化氣始寄胎玄妙玉女八十一年暨武丁庚辰二月十五日卯時降誕於楚之苦縣瀨鄉曲仁里從母左腋而生於李樹下指樹曰此吾姓也生時白首面黃長耳矩目鼻純骨雙柱耳有三漏門美鬚廣顙踈齒方口足蹈三五手把十文姓李名耳字伯陽號曰老子又號曰老聃周文王為西伯召為守藏史武王時遷為柱下史乃遊西極大秦竺乾等國號古先生化導其國康王時還歸于周復為柱下史昭王二十三年駕青牛車過函谷關度關令尹喜知之求得其道二十五年降於蜀青羊肆會尹喜同度流沙胡域至穆王時復還中夏敬王十七年孔子問道於老聃退而有猶龍之嘆赧王九年復出散關飛升崑崙秦時降浹河之濱號河上公授道安期生漢文帝時號廣成子文帝遣使詔問之公曰道尊德貴非可遙問帝即命駕詣之帝曰域中有四大王居一也子雖有道猶朕民也不能屈何乃高乎朕足使貧賤富貴公乃拊掌坐躍冉冉在虛空中如雲之升去地百餘丈而止於玄虛良久俯答曰今上不至天中不類人下不居地何民之有陛下焉能令富貴貧賤乎帝悟方下輦禮謝授帝道德二經蓋無世不出先塵劫而行化後無極而常存隱顯莫測變化無窮普度天人莫可具述云東王公東王公諱倪字君明天下未有民物時鍾化而生於碧海之上蒼靈之墟道性凝寂湛體無為贊迪玄功育化萬物主陽和之氣理於東方亦號東王公凡上天下地男子登仙得道者悉所掌焉嘗以丁卯日登臺觀望轉劫升天之仙凡有九品然始升之時先拜太公後謁金母受事既畢方得升九天入三清禮太上而觀元始漢初有群兒戲謡於道曰著青裙上天門揖金母拜木公時人莫之知唯子房往拜焉乃語人曰此東王公玉童西王母西王母即龜臺金母也得西華至妙之氣化生於伊川姓緱諱回字婉姈配位西方與東王公共理二氣調成天地陶鈞萬品凡上天下地女子之登仙者咸所隸焉居崑崙之圃閬風之苑玉樓玄臺九層左帶瑶池右環翠水女五華林媚蘭青娥瑶姬玉巵周穆王八駿西巡乃執白圭玄璧謁見王母復觴母于瑶池之上母為王謡曰白雲在天山林自出道里悠遠山川間之將子無死尚能復求後漢元封元年降武帝殿進蟠桃七枚於帝欲欲留核母曰此桃非世間所有三千年一實耳偶東方朔於牖開窺之母指曰此兒已二偷吾桃矣是日命侍女董雙成吹雲和之笛王子登彈八琅之璈許飛瓊鼓靈虛之簧安法興歌玄靈之曲為武帝壽焉赤松子赤松子神農時雨師煉神服氣能入水不濡入火不焚至崑崙山常止西王母石室中隨風雨上下炎帝少女追之亦得仙俱去高辛時為雨師間遊人間廣成子廣成子軒轅時人隱居崆洞山石室中黃帝造焉問以至道之要答曰至道之精窈窈冥冥至道之極昏昏默默無視無聽抱神以靜形將自正必靜必清毋勞爾形毋搖爾精毋俾爾思慮營營乃可長生愼內閉外多智多敗我守其一而處其和故千二百年未嘗衰老青烏公青烏公彭祖弟子也受明師指示審真仙妙理乃入華陰山中學道積四百七十一崴後服金液而升天彭祖彭祖錢鏗帝顓頊玄孫至殷末世年已七百餘歲而不衰好恬靜善於補導之術并服水晶雲母麋角常有少容穆王聞之以為大夫稱疾不與政事采女乘輜軿往問道於彭祖具受諸要因以教王王試為之有驗彭祖知之乃去不知所往其后七十餘年門人於流沙西見之鐵拐先生鐵拐先生姓李質本魁梧早歲聞道修真巖穴時李老君與宛丘先生嘗降山齋誨以道教一日先生將赴老君之約於華山囑其徒曰吾魄在此儻遊魂七日而不返若甫可化吾魄也徒以母疾迅歸六日化之先生至七日果歸失魄無依乃附一餓莩之尸而起故形跛惡非其質矣王子喬王子喬周靈王太子晉也好吹笙作鳳鳴遊伊洛之間道人浮丘公接晉上嵩高山三十餘年後見柏良謂曰可告我家七月七日待我於緱山頭至期果乘白鶴駐山頭可望不可到俯首謝時人數日方去後立祠緱氏山下尹喜尹喜字公文天水人初母氏嘗晝寢夢天下絳霄流繞其身及喜生時陸地自生蓮花及長眼有日精姿形長雅垂臂下膝堂堂有天人之貌少好學墳索隱德行仁不修俗禮損身濟物不求聞達周康王時為大夫仰觀乾象見東方有紫氣西邁知有聖人當度關而西乃求為函谷關令預敕關吏孫景曰若有形容殊俗車服異常者勿聽過時昭王二十三年七月老君果乘白輿駕青牛欲度關關吏入白喜喜曰今我得見聖人矣即具朝服出迎跪伏邀之曰願暫留神駕老君謝曰吾貧賤老叟居在關東田在關西今暫往取薪何故見留喜復稽首曰久知大聖當來西遊暴露有日願少憩神駕老君曰聞開道竺乾有古先生是以身就道經歷子關何過留耶喜曰觀大聖神姿超絶乃天上至尊邊夷何足往觀老君曰子何所見而知喜曰去冬十月天理星西行過昂自今月朔融風三至東方真氣狀如龍蛇而西變此大聖人之徵老君乃怡然笑曰善哉子之知吾吾亦已知子矣喜再拜曰敢問大聖姓字老君曰吾姓字渺渺從劫至劫非可盡説吾今姓李字伯陽號曰老聃喜於是就官舍設座供養行弟子禮老君乃為喜留關下百餘日盡傳以內外修煉之法時老君之御者徐甲少賃於老君約日顧百錢至關時當七百三千萬錢甲見老君去官遠適亟來索錢老君謂曰吾往西海諸國還當以黃金什直償爾甲如約及至問遂青牛於野老君欲試之乃以吉祥草化為一美女行至牧牛之所能以言戲甲甲惑之欲問遂負前約乃詣關令訟老君索傭錢老君謂甲曰汝隨我二百餘年汝久應死吾以太玄生符與汝所以得至今日汝何不念此而乃訟吾言訖符自口中飛出甲自成一白骨喜乃為甲叩頭請赦其罪以賜更生老君復以太玄生符投之甲即立生喜乃以錢償甲而禮遣之一日老君謂喜曰古先生者即吾之身嘗化乎竺乾今將返神還乎無名吾今逝矣喜叩首請侍行老君曰吾遊乎天地之表嬉乎玄冥之間四維八極上下無邊子欲隨吾烏可得焉喜曰入火赴淵下地上天灰身沒命願隨大仙老君曰汝雖骨相合道然受道日淺安得行化諸國也於是復以道德五千言授之期曰千日之外可尋吾於屬青羊之肆也言訖身坐雲華冉冉升空光燭館舍五色玄黃良久乃殁喜目斷雲霄涕泣扳戀名之曰西升經喜乃屏絶人事自著書九篇號關尹子至丁巳歲即往西屬尋訪青羊之肆老君以甲寅年升天至乙卯歲復從太微宫分身降生於蜀國太官李氏之家已先敕青龍化生為羊色如青金常在所生嬰兒之側愛玩無斁忽一日失羊童子尋覓得於市肆喜至蜀遍問居人無青肆者忽見童子牽羊因問此誰家羊牽欲何往童子答曰我家夫人生一兒愛玩此羊失來兩日兒啼不止今卻尋得欲還家喜即囑曰願為告夫人之子云尹喜至矣童子入告兒即賑衣而起曰令喜前來喜既入其家庭宇忽然高大湧出蓮花之座兒化數丈白金之身光明如日項有圓光坐於蓮花座上舉家驚怪兒曰吾老君也太微是宅真一為身主客相因何乃怪耶喜將慰無量稽首言曰不謂復奉天顔老君曰吾向留子者以子初受經訣未克成功是以待子於此今子保形煉色已造真妙心結紫絡面有神光金名表於玄圃玉扎繫於紫房也即命五老上帝四極鑑真授喜玉册金文號文始先生位為無上真人居二十四天王之上統領八萬仙士自此方得飛騰虛空參得龍駕李八百李八百蜀人名真居筠陽五龍岡歷夏商周年八百歲動行則八百里時人因號為李八百或隱山林或居廛市又修煉於華林山石室丹成還蜀中周穆王時居金堂山蜀人歷代見之號紫陽真君丁令威丁令威本遼東人學道於靈虛山後化鶴歸集華表而吟曰有鳥有鳥丁令威去家千歲今未歸城郭如故人民非何不學仙冢纍纍鬼谷子鬼谷子春秋時人姓王名詡嘗入雲夢山採藥得道顔如少童居青溪之鬼谷蘇秦張儀往問道三年辭去子遺之書曰二足下功名赫赫但春華至秋不得久茂今二子好朝露之榮忽長久之功輕喬松之永延貴一旦之浮爵夫女愛不極席男歡不畢輪痛哉鬼谷處人間數百歲後不知所之有餘符鬼谷子二書行於世劉越劉越周時有匡先生名續修於南嶂山時有一少年數來相訪言論奇偉先生異之問曰睹子風猷有日矣僣問鄉邦姓字答曰姓劉名越居在山之左山下有石高二丈許叩之即當相延先生如其語訪之叩石石忽自開雙户洞啓一小鬟迎先生行數十步繼有二青衣絳節前導漸見臺榭參差金碧掩映珍珍禽奇獸草木殊異真人冠玉冠朱綬劔佩來迎先生意欲留居之真人謂先生曰子陰功未滿後會可期他日相從未晚也飲玉酒三爵延齡保命湯一啜而出先生返顧所叩之石宛然如初他日復叩無所應矣太山老父太山老父者莫知其姓名漢武帝東巡狩見老父鋤于道間狀如五十許人而面若童子頭上白光高數尺怪而問之老父答曰臣年八十五時衰老垂死頭白齒落有道士教臣絶穀服木飲水并作神枕枕中有三十二物其二十四物以象二十四氣其八物以應八風臣導行之轉老為少髮白更黑齒落更生日行三百里臣今年八十矣武帝愛其方賜之金帛老父後入太山中或十年五年一還鄉里三百餘年乃不復還也白石生白石生中黃丈人弟子彭祖時已二千餘歲不愛飛升但以長生為貴而已以金液為上藥家貧不能得養豬牧羊十數年致富萬金乃買藥服之嘗煮白石為糧因就白石山居遂號白石生亦時食脯亦時辟穀曰能行三四百里顔色如三十許人或問何以不愛飛升答曰天上未必樂於人間也安期生安期生琅琊阜鄉人賣藥海邊時人皆呼千歲公秦始皇請見與語三夜賜金帛數萬出於阜鄉亭皆置去留書并赤玉舄一量為報曰後千歲求我於蓬萊山下始皇遣使者數輩入海求之未至蓬萊山輒遇風波而還乃立祠阜鄉亭並海邊十處東方朔東方朔字曼倩嘗出經年兄曰汝經年一歸何以慰我對曰朔暫之紫泥海有紫水污衣乃過虞淵湔洗朝發中還何云經年漢武帝時上書曰臣朔少失父母長養兄嫂今年二十二長九尺三寸口若懸珠齒若編貝勇若孟賁捷若慶忌廉若鮑叔信若尾生若此可以為天子臣矣臣朔冒死再拜以聞朔文辭不遜高自稱譽上偉之令待詔公車又遷待詔金馬門賜之食於前食盡懷其餘肉衣盡汙數賜縑帛擔楬而去嘗用所賜錢帛取少婦於長安中一歲即棄去更取所賜物盡填之女子人皆笑之朔曰如朔所謂避世於朝廷間者時酒酣據地歌曰陸沉於俗宫殿可以避世全身何必深山之中蒿廬之下朔將死謂同舍郎曰天下人無能知朔知朔者惟大伍公耳朔亡後武帝召大伍公問之答以不知帝曰公何所能曰頗善星曆帝問諸星具在度否曰諸星皆在獨不見歲星四十年今復見耳帝仰天嘆曰東方朔在朕傍十八年而不知為歲星因慘然不樂鍾離權鍾離權燕臺人後改名覺字寂道號王陽子又號雲房先生父為列侯宦雲中誕生真人時異光數丈侍衛皆驚真人頂圓額廣耳厚眉長目深鼻聳口方頰大唇臉如丹乳遠臂長如三歲兒晝夜不聲第七日躍然而言曰身遊紫府名書玉京及壯仕漢為大將征吐蕃失利獨騎奔逃山谷迷路夜入深林遇一胡僧蓬頭拂額體挂草衣引行數里見一村莊曰此東華先生成道處將軍可以歇息矣揖别而去真人未敢驚動莊中良久聞人語云此必碧眼胡人饒舌也一老人披白鹿裘扶青藜杖抗聲前曰來者非漢大將軍鍾離權耶汝何不寄宿山僧之所真人聞而大驚知為異人是時方脫虎狼之穴遽有鸞鶴之思乃回心向道哀求度世之方於是老人授長生真訣及金丹火候青龍劍法真人辭去回顧莊居不見其處後再遇華陽真人傳以太乙刀圭火符內丹雲遊至魯居鄒城入崆洞於紫金四皓峯居之得玉匣祕訣遂仙去馬成子馬成子秦扶風人性喜恬退不樂紛榮嘗自嘆曰人生若流電爾奈何久戀麈寰中於是棄家訪道入蜀之鶴鳴山石室中修煉二十餘年後遇異人授以神丹曰氣為內丹藥為外丹子得此服之當列為一仙矣言訖而去成子遵其術行之遂白日升天黃安黃安代群人年萬歲餘貌若童子常服硃砂舉身皆赤不著衣坐一神龜龜廣二尺時人問安坐龜幾年曰三千歲乃一出頭我得龜以來已五出頭矣行則負龜而趨漢武帝聞其異乃與論虛無神仙之事帝每屈禮焉及封泰山詔董謁李克孟岐郭瓊黃安五人同輦謂之仙臣帝崩後不知所之劉海蟾劉玄英號海蟾子明經事燕主劉守光為相雅喜性命欽崇黃老一日忽有道人自稱正陽子來謁海蟾邀坐堂上待以賓禮道人為演清靜無為之宗金液還丹之要既竟乃索雞卵十枚金錢十文以一文置之几上纍十卵於金錢若浮圖之狀海蟾警異之曰危哉道人曰人居榮祿之場履憂患之地其危殆甚復盡以其錢劈破擲之遂辭去海蟾繇此大悟遂解印辭朝易服從道遁迹終南山下丹成尸解有白氣自頂門出化鶴沖天浮丘伯浮丘伯姓李隱居嵩山服黃精二十年髮自返黑齒落更生久之道成白日飛升嘗作原道歌云虎伏龍亦藏龍藏先伏虎但畢河車功不用提防拒諸子學飛仙狂迷不得住左右得君臣四物相念護乾坤法象成自有真人顧劉晨劉晨剡縣人漢永平中與阮肇入天台採藥路迷不得返經十三日飢渴甚望山上有桃實共取食之下山取澗水飲見一杯流出中有胡麻飯焉二人喜曰此近人家矣遂度山出一大溪溪邊有二女色甚美顧笑曰劉阮二郎捉杯來耶劉阮異之二女歡然如舊曰來何晚耶即邀還家南壁東壁各有羅帷絳帳命侍女具饌有胡麻飯山羊脯甚甘美食畢行酒俄有羣女待桃笑曰賀汝壻來酒酣作樂夜半各就一帳宿婉熊殊絶至十日求還苦留半年氣候草木常似春百鳥啼詬歸思更勿二女曰罪根未滅使若等圭此遂指示還路及歸鄉邑零落已七世矣再往女家尋覓不獲晉太康八年失二人所在魏伯陽魏伯陽吳人性好道術不樂仕自乃入山作神丹時三弟子丹兩弟子心不盡誠丹成試之曰金丹雖成當先試之大犬無患方可服若犬死不可服也伯陽即以丹與犬食之犬即死伯陽曰作丹未成無乃未得神眀意耶服之恐復如犬奈何弟子曰先生服之不伯陽曰吾皆違世路委家干此不得仙吾亦恥歸死與生同吾當服之伯陽服丹入口即死一弟子曰師非凡人也服丹而死得無有意乎亦服之入口亦死二弟子乃相謂曰作丹求長生爾今服丹即死不如不服乃共出山為伯陽及死弟子求殯具伯陽即起將煉成妙丹納死弟子及犬口中須臾皆活於是將服丹弟子姓虞者同犬仙去逢入山伐薪人作手書寄謝二弟子嘗作參同契凡二卷其説似解周易其實假借爻象以寓作丹之旨張道陵張道陵字輔漢子房八世孫身長九尺二寸龐眉廣顙朱頂緑睛隆準方頤目有三角伏犀貫頂垂手過膝龍蹲虎步望之儼然漢光武建武十年生於天目山母初夢大人自北魁星中降至地以蘅薇香授之既覺滿室異香經月不散感而有孕及生日黃雲籠室紫氣盈庭室中光氣如日月七歲通道德經河洛圖緝之書皆極其奧舉賢良方正身雖仕而志在修煉入蜀愛蜀中溪嶺深秀遂隱於鶴鳴山弟子有王長者習天文通黃老相與煉龍虎大丹三年丹成真人年六十餘餌之若三十許人與王長入北嵩山遇繡衣使者告曰中峯石室藏上三皇內文黃帝九鼎太清丹經得而修之乃升天也於是真人齋戒七日入石室跫然有聲掘地取之果得丹書精思修煉能分形散影每泛舟池中誦經堂上隱几對客杖藜行吟一時並起人皆莫測西城房陵間有白虎神好飲人血每歲其鄉殺人祭之真人召其神戒之遂滅又梓州有大蛇時吐毒霧行人中毒輒死真人以法禁之不復為害順帝壬午歲正月十五夜真人在鶴鳴山夢覺惟聞鑾佩珊珊天樂隱隱瞪目東瞻見紫雲中素車一乘車中一神人容若氷玉神光照人不可正視車前一人敕真人曰子勿驚怖即太上老君也真人禮拜老君曰近蜀中有六大鬼神枉暴生民深可痛惜子其代吾治之以福生靈則子功無量而名録丹臺矣乃授以正一盟威祕籙三清衆經九百三十卷符籙丹竈祕訣七十二卷雌雄劔二把都功印一枚且曰與子千日為期後會閬苑真人乃叩頭領訖日味祕文按法遵修時有八部鬼帥各領鬼兵動億萬數周行人間暴殺萬民枉夭無數真人奉老君誥命佩盟威祕籙往青城山置琉璃高座左供大道元始天尊右置三十六部真經立十絶靈幡周匝法席鳴鍾扣磬布龍虎神兵衆鬼即挾兵刃矢石來害真人真人舉手一指化為一大蓮花拒之鬼衆復持火千餘炬來真人舉手一指鬼反自燒遙謂真人曰師自住峨嵋山何為來侵奪我居處真人曰汝等殘害衆生所以來伐汝擯之西方不毛之地奉老君命也自今速當遠避勿復行病人間如違即當詄戮無留種鬼王不服次日復會六大魔王率鬼兵百萬環攻真人乃以丹筆一畫衆鬼盡死惟六魔王仆地不能起扣頭求生真人不顧復以丹筆一裁此山遂分為二六魔王欲度不能始大聲哀求願往西方娑羅國居止焉真人乃許之倒筆再畫六魔群鬼悉起真人命王長肩一大石為橋度之真人猶欲服其心謂之曰試與爾各盡法力六魔曰惟命真人投身入火即足履青蓮而出鬼帥投火為火所燒真人入水乘黃龍而出鬼帥入水為水所溺真人以身入石透石而出鬼帥投石才入一寸真人呪神符一道左手指之鬼斃右手指之復生鬼帥左右指無生無死鬼帥化八大虎奔攫而來真人化一獅子逐之鬼帥化八大龍欲來擒師真人化金翅鳥啄龍目睛鬼帥作五色雲昏暗天地真人化五色日炎光輝灼雲即流散鬼帥變化技窮真人乃化一大石可重萬餘斤以藕絲懸之鬼帥營上令二鼠爭齧其絲欲墮鬼帥同聲哀告再不虐害生民真人遂命六大鬼王歸於北酆八部鬼帥竄於西域鬼衆猶躊蹰不去真人乃口敕神符一道飛上層霄須臾風雨雷電刀兵畢至群鬼滅影而遁真人至蒼溪縣雲臺山謂王長曰此山乃吾成功飛騰之地也遂卜居修九還七返之功一日復聆鸞珮天樂之音真人整衣叩伏見老君千乘萬騎來集雲際徘徊不下真人再拜老君乃命使者告曰子之功業合得九真上仙吾昔使子入蜀但區别人鬼以布清淨之化而子殺鬼過多又擅興風雨役使鬼神陰景翳晝殺氣穢空殊非大道好生之意上帝正責子過所以吾不得近子也子且退居勤行修謝吾待子於無何有鄉上清八景宫中言訖聖駕升去真人遂依告文與王長遷鶴鳴山謂弟子趙升曰彼處有妖當往除之及至值十二神女笑迎於山前因問曰此地有醎泉何在神女曰前大湫是毒龍處之真人遂書一符化為金翅鳥向湫上盤旋毒龍驚舍湫而去遂得鹹泉後居民煮之有鹽十二神女各出一玉環來獻曰妾等願事箕帚真人受其環以手緝之十二環合而為一謂曰吾投此環于井中能得之者應吾夙命也神女競解衣入井爭取玉環真人遂掩之盟曰令作井神無得復出彼方之民至今不罹神女之害而獲鹹井之利真人重修二十年乃復領趙升王長往鶴鳴山一日午時忽見一人黑幘絹衣佩劍捧一王函進曰奉上清真符召真人遊閬苑須臾有黑龍駕一紫輿玉女二人引真人登車旋踵至闕群仙禮謁良久忽二青童朱衣絳節前導曰老君至矣乃相與騰空而上至一殿金階玉砌或謂真人曰將朝太上元始天尊也真人整衣趍進殿上移時殿上敕青童諭真人以正一盟威之法使世世宣布為人間天師勸度未悟仍密諭飛升之期真人受命乃復還鶴鳴山桓帝永壽元年正月七日五更初長升見空中老君駕龍輿命真人乘白鶴同往成都重演正一盟威之旨説北斗南斗經畢老君復去真人欲留其神迹乃於雲臺西北半崖間舉身躍入石壁中自崖頂而出其山因成二洞九月九日在巴西赤城渠亭山中上帝遣使者持玉册授真人正一真人之號諭以行當飛升真人乃以盟威都功等諸品祕籙斬邪二劍玉册玉印以授其長子衡日謂長升曰尚有餘丹二子可分餌之今日當隨吾上升矣亭午群仙儀從畢至天樂擁道於雲臺峯白日升天時真人年一百二十三歲也蕭史蕭史得道好吹簫奉穆公以女弄玉妻之遂教弄玉吹簫作鳳鳴有鳳來止其屋公為作鳳臺后弄玉乘鳳蕭史乘龍其升天去梅福梅福字子真壽春人仕漢為南昌尉見王莽專政嘆曰生為我酷形為我辱知為我毒身為我桎梏遂棄家求仙遍遊雁蕩南閩諸山至仙霞山遇空同仙君授以內外丹法謂福曰汝緣在飛鴻山福遂往結庵修煉丹成復遠壽春一日紫霧浮空金童玉女捧詔控鸞下福拜詔辭家乘鸞而去人見福於宋元豐間封壽春真人黃初平黃初平晉丹溪人年十五收羊遇道士引至金華山石室中四十餘年其兄初起尋之不獲後遇道士善卜起問之曰金華山中有一牧羊兒初起即往見初平問羊安在曰在山東往視之但見白石磊磊初平叱之石皆成羊初起亦亦棄妻子學道後亦成仙費長房費長房汝南人曾為市掾有老翁賣藥于市懸一壺於肆頭及市罷輒跳入壺中市人莫之見惟長房於樓上睹之異焉因往再拜翁曰子明日更來長房旦日果往翁乃與俱入壺中但見玉堂廠麗旨酒甘肴盈衍其中共飲畢而出翁囑不可與人言後乃就長房樓上曰我仙人也以過見責人間我今去子寧能相隨乎樓下有少酒與卿為别長房使十人扛之猶不能舉翁笑而以一指提上視器如有一升許而二人飲之終日不盡長房心欲求道而念家人為憂翁知乃斷一青竹使懸之舍後家人見之長房也以為縊死大小驚號遂殯殮之長房立其傍而衆莫之見於是隨翁入山踐荆棘於群虎之中留使獨處長房亦不恐又卧長房於空室以朽索縣心斤石於其上衆蛇競來齧索欲斷長房亦不移翁還撫之曰子可教也復使食糞糞中有三蟲臭穢特甚長房意惡之翁曰子幾得道恨於此不成奈何長房辭歸翁與一竹杖曰此任所之頃刻至矣至當以杖投葛陂中長房乘杖須臾來歸自謂去家適經旬日而已十餘年矣即以杖投陂顧視則龍也家人請其死久驚訝不信長房曰往日所葬竹杖耳乃發冢剖棺杖猶存焉遂能醫療衆病鞭笞百鬼又嘗食客而使使至宋市鮓須臾還乃飯桓景嘗學于長房一日謂景曰九月九日汝家有大災可作絳囊盛茱萸繫臂上登高山飲菊花酒禍可消景如其言舉家登山夕還見牛羊雞犬皆暴死焉藍采和藍采和不知何許人常衣破𧟋衫六銙黑木腰帶闊三寸餘一腳著靴一腳跣足夏則衫內加絮冬嘗卧雪中氣出加每於城市乞索持大拍板長三尺餘醉而踏歌老少皆隨看之似狂非狂歌詞率爾而作皆神仙意人莫之測得錢則用繩穿拖之而行或散失亦不顧或贈貧者或與酒遂周遊天下人有洎兒童時見之者及班白見之顔狀如故後於濠梁酒樓上飲酒聞有笙簫聲忽然乘鷦而上擲下靴衫腰帶拍板冉冉而去麻衣子麻衣子姓李名和生而紺髮美姿稍長厭世穢腐遂入終南山忽遇一道者授以道祕戒之曰南陽之間湍水之陽有山靈堂岩洞其旁神開汝鄉汝則往之可以翕神于蒼茫麻衣往求之遇樵者導其處居洞中十有九年晉義熙間大旱居民張奭率衆請雨麻衣以無術答之請者不輟是夕有少年十二人謂麻衣曰若再請但許之麻衣怪而諾之翌日果大雨十二人復來拜曰吾屬龍也上帝以師道業成令輔師行化耳劉宋大明初年百有一歲儼坐而尸解麻姑麻姑仙人王方平之妹漢桓帝時方平降蔡經之家曰汝當得度世故來教汝但汝氣少肉多未能即上天當作尸解乃告以要言而去經後忽身發熱如火三日肉消骨直入室以被自覆忽然失其所在視其被中但有形如蛇蛻後十餘年忽還家語家人曰七月十日王君復來當作酒數百斛以待其日方平果著遠遊冠乘五龍車前后麾節旌旗導衛如大將軍侍從既至從官皆隱經父兄參畢方平乃遣人迎麻姑少頃麻姑至經舉家見之年可十八許頂中作髻餘髮散垂至腰錦衣繡裳光彩耀目坐定自進行厨劈麟脯器皆金玉時經婦新産麻姑見之乃曰噫且止勿前索少許米來擲地皆成丹砂方平笑曰麻姑猶作少年戲也姑云接侍以來東海三為桑田蓬萊水又淺矣方平亦曰聖人皆言海中將復揚塵也麻姑手似鳥爪蔡經私念背癢時得此爪搔之佳方平即知乃鞭經背曰麻姑神人也汝謂其爪可搔背癢耶方平去麻姑亦辭去
