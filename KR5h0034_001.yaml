front:
  text: 消搖墟經卷第一槐一夫人生墮落世網彼蠅爭蟻逐輩無論已即古稱長心逸節亦往往煆羽羈足若轅駒檻烏然夫誰能蟬蛻鳳舉而消搖物外也者緬惟羽客仙翁吸雲英餐石髓駕紫鳳以翩韆馭青牛而遊遨一條藜杖泛雲水之三千半片枘衣訪洞天之十二蒙莊氏所稱消搖遊者意在斯乎豫性寡諧謝絶一切世氛獨紫芝白石有夙癖焉洪生自誠氏新都弟子也一日携仙紀一編徵言於豫豫披閲之青霞紫氣映發左右宛若遊海上而揖羣真令人飄然欲仙真欲界丹丘塵世蓬島也雖仙有靈根道有夙契得皮忘髓終非升舉向上事顧塵勞絫劫中定喘拭眯㸐名香啜苦茗時一露盥玩之不猶吞火而飲之以氷哉他日倘逸樊籠而步碧虛請執是以作玉杵或不謂無因云消搖墟目
